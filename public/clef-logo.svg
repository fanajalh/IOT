<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="240" />
    </clipPath>
    <radialGradient id="redBgGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF4D2D" />
      <stop offset="70%" stop-color="#D92600" />
      <stop offset="100%" stop-color="#A61500" />
    </radialGradient>
    <linearGradient id="starburstGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE838" />
      <stop offset="100%" stop-color="#FFBF00" />
    </linearGradient>
    <linearGradient id="handleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC843" />
      <stop offset="50%" stop-color="#E68A00" />
      <stop offset="100%" stop-color="#A85700" />
    </linearGradient>
    <linearGradient id="baseOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E87613" />
      <stop offset="100%" stop-color="#A34400" />
    </linearGradient>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Red Circle Background -->
    <circle cx="250" cy="250" r="240" fill="url(#redBgGrad)" />

    <!-- Pop Art Halftone Dots Pattern -->
    <g fill="#B81A00" opacity="0.35">
      <circle cx="50" cy="50" r="8"/><circle cx="90" cy="50" r="8"/><circle cx="130" cy="50" r="8"/><circle cx="170" cy="50" r="8"/><circle cx="210" cy="50" r="8"/><circle cx="250" cy="50" r="8"/><circle cx="290" cy="50" r="8"/><circle cx="330" cy="50" r="8"/><circle cx="370" cy="50" r="8"/><circle cx="410" cy="50" r="8"/><circle cx="450" cy="50" r="8"/>
      <circle cx="70" cy="90" r="8"/><circle cx="110" cy="90" r="8"/><circle cx="150" cy="90" r="8"/><circle cx="190" cy="90" r="8"/><circle cx="230" cy="90" r="8"/><circle cx="270" cy="90" r="8"/><circle cx="310" cy="90" r="8"/><circle cx="350" cy="90" r="8"/><circle cx="390" cy="90" r="8"/><circle cx="430" cy="90" r="8"/>
      <circle cx="50" cy="130" r="8"/><circle cx="90" cy="130" r="8"/><circle cx="130" cy="130" r="8"/><circle cx="170" cy="130" r="8"/><circle cx="210" cy="130" r="8"/><circle cx="250" cy="130" r="8"/><circle cx="290" cy="130" r="8"/><circle cx="330" cy="130" r="8"/><circle cx="370" cy="130" r="8"/><circle cx="410" cy="130" r="8"/><circle cx="450" cy="130" r="8"/>
      <circle cx="70" cy="170" r="8"/><circle cx="110" cy="170" r="8"/><circle cx="150" cy="170" r="8"/><circle cx="190" cy="170" r="8"/><circle cx="230" cy="170" r="8"/><circle cx="270" cy="170" r="8"/><circle cx="310" cy="170" r="8"/><circle cx="350" cy="170" r="8"/><circle cx="390" cy="170" r="8"/><circle cx="430" cy="170" r="8"/>
      <circle cx="50" cy="210" r="8"/><circle cx="90" cy="210" r="8"/><circle cx="130" cy="210" r="8"/><circle cx="170" cy="210" r="8"/><circle cx="210" cy="210" r="8"/><circle cx="250" cy="210" r="8"/><circle cx="290" cy="210" r="8"/><circle cx="330" cy="210" r="8"/><circle cx="370" cy="210" r="8"/><circle cx="410" cy="210" r="8"/><circle cx="450" cy="210" r="8"/>
      <circle cx="70" cy="250" r="8"/><circle cx="110" cy="250" r="8"/><circle cx="150" cy="250" r="8"/><circle cx="190" cy="250" r="8"/><circle cx="230" cy="250" r="8"/><circle cx="270" cy="250" r="8"/><circle cx="310" cy="250" r="8"/><circle cx="350" cy="250" r="8"/><circle cx="390" cy="250" r="8"/><circle cx="430" cy="250" r="8"/>
      <circle cx="50" cy="290" r="8"/><circle cx="90" cy="290" r="8"/><circle cx="130" cy="290" r="8"/><circle cx="170" cy="290" r="8"/><circle cx="210" cy="290" r="8"/><circle cx="250" cy="290" r="8"/><circle cx="290" cy="290" r="8"/><circle cx="330" cy="290" r="8"/><circle cx="370" cy="290" r="8"/><circle cx="410" cy="290" r="8"/><circle cx="450" cy="290" r="8"/>
      <circle cx="70" cy="330" r="8"/><circle cx="110" cy="330" r="8"/><circle cx="150" cy="330" r="8"/><circle cx="190" cy="330" r="8"/><circle cx="230" cy="330" r="8"/><circle cx="270" cy="330" r="8"/><circle cx="310" cy="330" r="8"/><circle cx="350" cy="330" r="8"/><circle cx="390" cy="330" r="8"/><circle cx="430" cy="330" r="8"/>
      <circle cx="50" cy="370" r="8"/><circle cx="90" cy="370" r="8"/><circle cx="130" cy="370" r="8"/><circle cx="170" cy="370" r="8"/><circle cx="210" cy="370" r="8"/><circle cx="250" cy="370" r="8"/><circle cx="290" cy="370" r="8"/><circle cx="330" cy="370" r="8"/><circle cx="370" cy="370" r="8"/><circle cx="410" cy="370" r="8"/><circle cx="450" cy="370" r="8"/>
      <circle cx="70" cy="410" r="8"/><circle cx="110" cy="410" r="8"/><circle cx="150" cy="410" r="8"/><circle cx="190" cy="410" r="8"/><circle cx="230" cy="410" r="8"/><circle cx="270" cy="410" r="8"/><circle cx="310" cy="410" r="8"/><circle cx="350" cy="410" r="8"/><circle cx="390" cy="410" r="8"/><circle cx="430" cy="410" r="8"/>
    </g>

    <!-- White dots on left border -->
    <circle cx="58" cy="160" r="14" fill="#ffffff" />
    <circle cx="26" cy="205" r="12" fill="#ffffff" />
    <circle cx="26" cy="250" r="12" fill="#ffffff" />

    <!-- Starburst Shadow (Black offset) -->
    <polygon points="250,90 280,150 350,130 320,195 400,225 340,270 380,340 310,335 290,410 240,360 190,420 175,345 105,360 135,295 80,250 145,215 110,150 180,165 210,100"
             fill="#000000" transform="translate(10, 12)" />

    <!-- Starburst Fill (Yellow Comic Explosion) -->
    <polygon points="250,90 280,150 350,130 320,195 400,225 340,270 380,340 310,335 290,410 240,360 190,420 175,345 105,360 135,295 80,250 145,215 110,150 180,165 210,100"
             fill="url(#starburstGrad)" stroke="#6E1000" stroke-width="7" stroke-linejoin="round" />

    <!-- White Dome Arch outline -->
    <path d="M 185 330 A 75 75 0 0 1 325 330" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <!-- White Oval Shadow Base under lever -->
    <ellipse cx="255" cy="345" rx="55" ry="14" fill="#FFFFFF" />

    <!-- 3D Solenoid / Clef Lever Device -->
    <!-- Base Box (Orange/Brown 3D) -->
    <path d="M 210 240 L 295 215 L 305 285 L 220 315 Z" fill="url(#baseOrange)" stroke="#301200" stroke-width="5" stroke-linejoin="round" />
    <path d="M 220 315 L 305 285 L 305 305 L 220 335 Z" fill="#6B2900" stroke="#301200" stroke-width="5" stroke-linejoin="round" />

    <!-- Green Plate Top -->
    <path d="M 230 250 L 280 235 L 290 265 L 240 280 Z" fill="#00C853" stroke="#1B5E20" stroke-width="4" stroke-linejoin="round" />
    <path d="M 242 258 L 272 248 L 278 266 L 248 276 Z" fill="#69F0AE" />

    <!-- Green Rod / Lever Stem -->
    <path d="M 255 175 L 265 175 L 260 260 L 250 260 Z" fill="#00C853" stroke="#1B5E20" stroke-width="4" stroke-linejoin="round" />

    <!-- Hexagon Handle Top (Gold/Orange) -->
    <polygon points="255,130 285,145 285,180 255,195 225,180 225,145" fill="url(#handleGold)" stroke="#301200" stroke-width="5" stroke-linejoin="round" />
    <!-- Highlight on handle -->
    <polygon points="248,138 272,148 268,168 244,158" fill="#FFE57F" opacity="0.8" />

    <!-- Sparkle Stars -->
    <path d="M 150 380 Q 150 395 135 395 Q 150 395 150 410 Q 150 395 165 395 Q 150 395 150 380 Z" fill="#FFFFFF" />
    <path d="M 410 255 Q 410 268 397 268 Q 410 268 410 281 Q 410 268 423 268 Q 410 268 410 255 Z" fill="#FFFFFF" />

  </g>
</svg>
